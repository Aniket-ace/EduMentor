{% extends "base.html" %}
{% block title %}Edit Mark{% endblock %}

{% block content %}
<div class="container">
  <h2>Edit Mark</h2>
  <form method="POST" action="{{ url_for('student.edit_mark', mark_id=mark.id) }}">
    <div class="form-group">
      <label for="subject">Subject</label>
      <input id="subject" name="subject" required value="{{ mark.subject }}">
    </div>

    <div class="form-group">
      <label for="marks_obtained">Marks obtained</label>
      <input id="marks_obtained" name="marks_obtained" type="number" step="0.01"
             value="{{ mark.marks_obtained }}" required>
    </div>

    <div class="form-group">
      <label for="max_marks">Max marks</label>
      <input id="max_marks" name="max_marks" type="number" step="0.01"
             value="{{ mark.max_marks }}" required>
    </div>

    <div class="form-group">
      <label for="exam_date">Exam date</label>
      <input id="exam_date" name="exam_date" type="date"
             value="{{ mark.exam_date.strftime('%Y-%m-%d') if mark.exam_date else '' }}">
    </div>

    <div style="margin-top:12px;">
      <button type="submit" class="btn primary">Save</button>
      <a href="{{ url_for('student.dashboard') }}" class="btn ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
